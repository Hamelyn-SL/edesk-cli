[package]
name = "edesk"
description = "A gh-style command-line interface for the eDesk API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["edesk", "helpdesk", "cli"]
categories = ["command-line-utilities"]

[dependencies]
edesk-client = { path = "../edesk-client", version = "0.1.1" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
comfy-table = "7"
owo-colors = "4"
dialoguer = "0.12"
# async-secret-service (zbus) is pure Rust — no libdbus system dependency on Linux
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
etcetera = "0.10"
toml_edit = "0.23"
jaq-core = "3.0.0"
jaq-std = "3.0.0"
jaq-json = { version = "2.0.0", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httpmock = "0.7"
tempfile = "3"
